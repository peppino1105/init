[package]
name = "dahua-dhip-adduser"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
